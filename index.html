<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060606">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<title>Player – 0adjs shop</title>
<style>
:root{
  --bg:#060606;--surface:#0e0e0e;--surface-2:#141414;--line:#232323;--line-2:#331414;
  --text:#f4f4f2;--muted:#9a9a96;--dim:#666;--red:#f01818;--red-hot:#ff3030;--red-deep:#2a0808;--green:#2fd06b;
  --display:'Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(900px 420px at 50% -120px,#f0181818,transparent 70%),var(--bg)}
:focus-visible{outline:2px solid var(--red-hot);outline-offset:3px;border-radius:8px}
.hidden{display:none!important}
svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 max(5%,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:19px;letter-spacing:-.5px}.logo span{color:var(--red);margin-left:4px}
main{flex:1;width:min(980px,92%);margin:0 auto;padding:32px 0 60px}
h1{font-family:var(--display);letter-spacing:-.035em;margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}

.card{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:inset 0 1px #ffffff08,0 16px 48px #000a;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--red),transparent 65%);opacity:.7}
.open{max-width:620px;margin:6vh auto 0}
.open h1{font-size:clamp(30px,6vw,44px);line-height:1;margin-bottom:8px}
form{display:flex;gap:10px;margin-top:22px}
input{flex:1;min-width:0;border:1px solid #2a2a2a;background:#080808;color:var(--text);border-radius:12px;padding:14px;font:inherit;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--red);box-shadow:0 0 0 3px #f0181822}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 20px;font:600 14px var(--body);cursor:pointer;background:var(--red);color:#fff;box-shadow:0 0 30px #f0181830;transition:background .15s,transform .1s}
.btn:hover{background:var(--red-hot)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn svg{width:18px;height:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips b{font-weight:500;font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.note{margin:18px 0 0;color:var(--dim);font-size:13px;line-height:1.6}
.err{color:#ff7a7a;font-size:13px;min-height:18px;margin-top:12px}

/* player */
.player{position:relative;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px #000c;aspect-ratio:16/9;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.player:fullscreen{border-radius:0;border:0;aspect-ratio:auto}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.bigplay{width:76px;height:76px;border-radius:50%;background:rgba(240,24,24,.92);display:grid;place-items:center;box-shadow:0 0 50px #f0181866;transition:opacity .2s,transform .2s}
.bigplay svg{width:32px;height:32px;fill:#fff;stroke:none;margin-left:4px}
.player.playing .bigplay{opacity:0;transform:scale(1.3)}
.spin{position:absolute;width:54px;height:54px;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--red-hot);animation:r .8s linear infinite;opacity:0;transition:opacity .15s}
.player.loading .spin{opacity:1}
@keyframes r{to{transform:rotate(360deg)}}
.ripple{position:absolute;top:50%;transform:translateY(-50%);padding:14px 18px;border-radius:99px;background:#000a;font-weight:700;font-size:14px;opacity:0;pointer-events:none}
.ripple.l{left:10%}.ripple.r{right:10%}.ripple.show{animation:rp .55s ease-out}
@keyframes rp{0%{opacity:1}100%{opacity:0}}
.controls{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 10px;background:linear-gradient(transparent,#000d);transition:opacity .25s}
.player.idle.playing .controls{opacity:0;pointer-events:none}
.player.idle.playing{cursor:none}
.bar{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;width:100%;height:4px;border-radius:9px;background:#ffffff2a;transition:height .12s}
.bar:hover .track,.bar.drag .track{height:7px}
.buf,.fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.buf{background:#ffffff40}.fill{background:var(--red)}
.knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 10px #000;transform:scale(0);transition:transform .12s}
.bar:hover .knob,.bar.drag .knob{transform:scale(1)}
.tip{position:absolute;bottom:26px;transform:translateX(-50%);background:#000c;padding:3px 8px;border-radius:8px;font-size:12px;font-variant-numeric:tabular-nums;opacity:0;pointer-events:none}
.bar:hover .tip,.bar.drag .tip{opacity:1}
.row{display:flex;align-items:center;gap:4px}
.row .sp{flex:1}
.ib{background:none;border:0;color:#fff;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;cursor:pointer;padding:0;opacity:.92}
.ib:hover{background:#ffffff1c;opacity:1}
.time{font-size:13px;font-variant-numeric:tabular-nums;color:#ddd;padding:0 8px;white-space:nowrap}
.vol{width:0;opacity:0;transition:width .2s,opacity .2s;accent-color:var(--red);padding:0;height:4px;margin:0;border:0;background:none;box-shadow:none}
.vgroup:hover .vol,.vol:focus{width:84px;opacity:1;margin-right:8px}
.speed{font:700 13px var(--body);width:auto;padding:0 10px}
.fill-play{fill:currentColor;stroke:none}

.meta{margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.meta h1{font-size:clamp(18px,3.4vw,24px);overflow-wrap:anywhere}
.meta .acts{display:flex;gap:8px}
.source-line{margin-top:10px;color:var(--dim);font-size:12px;word-break:break-all}.source-line code{color:#bbb}.fail{margin-top:18px;padding:20px;border:1px solid var(--line-2);background:var(--red-deep);border-radius:16px;color:#ffb0b0;line-height:1.6;font-size:14px}
.fail b{display:block;color:#fff;margin-bottom:6px;font-family:var(--display);font-size:16px}
.fail ul{margin:8px 0 0;padding-left:20px;color:#e59a9a}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:#151515;border:1px solid #333;padding:11px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){
  form{flex-direction:column}
  .controls{padding:28px 6px 4px}
  .ib{width:38px;height:38px}.time{padding:0 4px;font-size:12px}
  .vgroup{display:none}
  .bigplay{width:60px;height:60px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="?" style="text-decoration:none;color:inherit">0ADJS<span>PLAYER</span></a>
</header>

<main>
  <section id="open" class="card open hidden">
    <h1>Play any video link</h1>
    <p class="sub">Paste a direct video URL. Nothing is uploaded or stored.</p>
    <form id="openForm">
      <input id="urlIn" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://example.com/video.mp4" required>
      <button class="btn">Play</button>
    </form>
    <div id="openErr" class="err" role="alert"></div>
    <div class="chips"><b>MP4</b><b>WebM</b><b>HLS</b><b>Direct URLs</b><b>Google Drive*</b><b>Dropbox*</b></div>
    <p class="note">*MKV and some codecs only play if your browser supports them. The link must be a direct file link, not a web page.</p>
  </section>

  <section id="view" class="hidden">
    <div id="player" class="player">
      <video id="v" playsinline preload="metadata" referrerpolicy="no-referrer"></video>
      <div class="center"><div class="spin"></div><div class="bigplay"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></div></div>
      <div id="rl" class="ripple l">−10s</div><div id="rr" class="ripple r">+10s</div>
      <div class="controls" id="ctl">
        <div class="bar" id="bar"><div class="track"><div class="buf" id="buf"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div><div class="tip" id="tip">0:00</div></div>
        <div class="row">
          <button class="ib" id="pp" aria-label="Play/Pause"></button>
          <button class="ib" id="back" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M10 9v6M14 9h-2v3h2a1.500 1.500 0 0 1 0 3h-2" stroke-width="1.600"/></svg></button>
          <button class="ib" id="fwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/><path d="M10 9v6M14 9h-2v3h2a1.500 1.500 0 0 1 0 3h-2" stroke-width="1.600"/></svg></button>
          <div class="vgroup row"><button class="ib" id="mute" aria-label="Mute"></button><input id="vol" class="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div>
          <span class="time" id="time">0:00 / 0:00</span>
          <span class="sp"></span>
          <button class="ib speed" id="speed" aria-label="Playback speed">1×</button>
          <button class="ib" id="pip" aria-label="Picture in picture"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor"/></svg></button>
          <button class="ib" id="fs" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        </div>
      </div>
    </div>
    <div id="fail" class="fail hidden"></div>
    <div id="sourceLine" class="source-line hidden"></div>
    <div class="meta">
      <h1 id="title">Video</h1>
      <div class="acts">
        <button class="btn ghost" id="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy link</button>
        <a class="btn ghost" href="?">Open another</a>
      </div>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const v = $('v'), P = $('player');
  const ICO = {
    play:'<svg viewBox="0 0 24 24" class="fill-play"><path d="M7 4l13 8-13 8z"/></svg>',
    pause:'<svg viewBox="0 0 24 24" class="fill-play"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>',
    vol:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
    mute:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6M22 9l-5 6"/></svg>'
  };
  const fmt = s => { if (!Number.isFinite(s) || s < 0) return '0:00'; s=Math.floor(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
  let toastTimer, hls=null, source='', key='', idleTimer, lastTap=0, tapTimer=null, dragging=false, proxyTried=false, hlsProxy=false;

  function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>e.classList.remove('show'),2200); }
  function validUrl(raw){ try { const u=new URL(raw); return /^https?:$/.test(u.protocol)&&u.hostname.includes('.'); } catch { return false; } }
  function normalize(raw){
    let u=String(raw||'').trim(); if(!u)return null; if(!/^https?:\/\//i.test(u))u='https://'+u; if(!validUrl(u))return null;
    const x=new URL(u);
    if(/(^|\.)dropbox\.com$/i.test(x.hostname)){ x.searchParams.delete('dl'); x.searchParams.set('raw','1'); return x.toString(); }
    if(/drive\.google\.com$/i.test(x.hostname)){
      const m=x.pathname.match(/\/file\/d\/([^/]+)/i)||x.pathname.match(/\/d\/([^/]+)/i);
      const id=m?m[1]:x.searchParams.get('id');
      if(id)return 'https://drive.usercontent.google.com/download?id='+encodeURIComponent(id)+'&export=download&confirm=t';
    }
    return x.toString();
  }
  function fileName(u){ try { const p=new URL(u).pathname.split('/').filter(Boolean).pop(); return p?decodeURIComponent(p):'Video'; } catch { return 'Video'; } }
  function setIcons(){ $('pp').innerHTML=v.paused?ICO.play:ICO.pause; $('mute').innerHTML=(v.muted||v.volume===0)?ICO.mute:ICO.vol; }
  function setLoading(on){ P.classList.toggle('loading',on); }
  function fail(title,msg,details=true){
    setLoading(false); const f=$('fail'); f.classList.remove('hidden');
    f.innerHTML='<b>'+escapeHtml(title)+'</b><div>'+escapeHtml(msg)+'</div><button class="btn ghost" style="margin-top:14px" onclick="window.__aikuRetry&&window.__aikuRetry()">Retry through proxy</button>'+(details?'<ul><li>Use a direct media URL, not a webpage URL.</li><li>This player automatically tried the Vercel streaming proxy too.</li><li>For best compatibility use MP4 with H.264 video and AAC audio.</li><li>HLS requires a valid .m3u8 playlist and reachable segments.</li></ul>':'');
  }
  function proxyUrl(u){ return '/api/proxy?url='+encodeURIComponent(u); }
  function showSource(){ const e=$('sourceLine'); if(!e)return; e.classList.remove('hidden'); e.innerHTML='Source: <code>'+escapeHtml(source)+'</code>'; }
  window.__aikuRetry=()=>{ if(!tryProxy()) toast('Proxy retry already used'); };
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function destroyHls(){ if(hls){ try{hls.destroy();}catch{} hls=null; } hlsProxy=false; }
  function makeHls(u){
    const useProxy = hlsProxy;
    if(window.Hls && Hls.isSupported()){
      const cfg={enableWorker:true,lowLatencyMode:false,backBufferLength:90};
      if(useProxy){ cfg.xhrSetup=(xhr,url)=>{ xhr.open('GET','/api/proxy?url='+encodeURIComponent(url),true); }; }
      hls=new Hls(cfg); hls.loadSource(u); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>setLoading(false));
      hls.on(Hls.Events.ERROR,(_,d)=>{
        if(!d.fatal)return;
        if(!hlsProxy && !proxyTried){
          proxyTried=true; hlsProxy=true; destroyHls(); toast('Direct HLS failed — trying streaming proxy'); setLoading(true); makeHls(source); return;
        }
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR){ try{hls.startLoad();}catch{} }
        else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){ try{hls.recoverMediaError();}catch{} }
        else fail('HLS playback failed',d.details||'The stream could not be loaded.');
      });
      return true;
    }
    if(v.canPlayType('application/vnd.apple.mpegurl')) { v.src=useProxy?proxyUrl(u):u; return true; }
    return false;
  }
  function loadSource(u){
    destroyHls(); v.pause(); v.removeAttribute('src'); v.load(); setLoading(true); $('fail').classList.add('hidden');
    source=u; key='aiku-pos:'+u; proxyTried=false; hlsProxy=false; showSource();
    if(/\.m3u8(?:$|[?#])/i.test(u)){
      const use=()=>{ if(!makeHls(u)) fail('HLS is not supported','This browser cannot play HLS streams.'); };
      if(window.Hls) use(); else { const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js'; s.onload=use; s.onerror=()=>{ hlsProxy=true; const t=document.createElement('script'); t.src='https://unpkg.com/hls.js@1.6.13/dist/hls.min.js'; t.onload=use; t.onerror=()=>fail('Could not load HLS engine','Your network blocked the HLS playback library.'); document.head.appendChild(t); }; document.head.appendChild(s); }
    } else { v.src=u; v.load(); }
  }
  function tryProxy(){
    if(proxyTried || !source)return false;
    proxyTried=true; setLoading(true); toast('Trying streaming proxy…');
    destroyHls();
    if(/\.m3u8(?:$|[?#])/i.test(source)){ hlsProxy=true; if(!makeHls(source)) fail('HLS is not supported','This browser cannot play HLS streams.'); }
    else { v.src=proxyUrl(source); v.load(); }
    return true;
  }

  function start(raw){
    const u=normalize(raw); $('view').classList.remove('hidden'); $('open').classList.add('hidden');
    if(!u)return fail('Invalid video URL','Enter a full http:// or https:// media URL.',false);
    if(location.protocol==='https:'&&u.startsWith('http:')) return fail('Blocked insecure video','This page is HTTPS, so the browser blocks an HTTP media URL.',false);
    $('title').textContent=fileName(u); document.title=fileName(u)+' – Aiku Player'; loadSource(u); setIcons();
  }

  function toggle(){ if(v.paused){v.play().catch(()=>toast('Playback was blocked — tap Play again'));} else v.pause(); }
  function seekBy(s){ if(Number.isFinite(v.duration))v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+s)); }
  function wake(){ P.classList.remove('idle'); clearTimeout(idleTimer); if(!v.paused)idleTimer=setTimeout(()=>P.classList.add('idle'),2600); }
  function flash(id){const e=$(id);e.classList.remove('show');void e.offsetWidth;e.classList.add('show');}

  $('openForm').addEventListener('submit',e=>{e.preventDefault();const raw=$('urlIn').value.trim();if(!normalize(raw)){$('openErr').textContent='Enter a valid http:// or https:// URL.';return;}location.search='?url='+encodeURIComponent(raw);});
  $('pp').onclick=toggle; $('back').onclick=()=>seekBy(-10); $('fwd').onclick=()=>seekBy(10);
  $('mute').onclick=()=>{v.muted=!v.muted;setIcons();};
  $('vol').oninput=e=>{v.volume=Number(e.target.value);v.muted=false;setIcons();};
  const SPEEDS=[1,.75,1.25,1.5,1.75,2];let si=0;
  $('speed').onclick=()=>{si=(si+1)%SPEEDS.length;v.playbackRate=SPEEDS[si];$('speed').textContent=SPEEDS[si]+'×';};
  $('pip').onclick=async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else if(document.pictureInPictureEnabled)await v.requestPictureInPicture();else toast('Picture-in-picture is not available');}catch{toast('Picture-in-picture is not available');}};
  $('fs').onclick=()=>{try{if(document.fullscreenElement){document.exitFullscreen();}else if(P.requestFullscreen){P.requestFullscreen();}else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();}}catch{toast('Fullscreen is not available');}};
  $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link copied');}catch{toast('Copy failed');}};

  ['loadstart','waiting','stalled'].forEach(e=>v.addEventListener(e,()=>setLoading(true)));
  ['loadeddata','canplay','playing'].forEach(e=>v.addEventListener(e,()=>setLoading(false)));
  v.addEventListener('play',()=>{P.classList.add('playing');setIcons();wake();});
  v.addEventListener('pause',()=>{P.classList.remove('playing','idle');setIcons();});
  v.addEventListener('volumechange',()=>{$('vol').value=v.muted?0:v.volume;setIcons();});
  v.addEventListener('error',()=>{
    const er=v.error; const code=er&&er.code;
    if(!proxyTried && source && tryProxy()) return;
    const msg=code===4?'Unsupported media response or codec.':code===2?'The network connection to the video failed.':'The video could not be loaded or decoded.';
    fail('Can’t play this video',msg);
  });
  v.addEventListener('ended',()=>{try{localStorage.removeItem(key);}catch{}P.classList.remove('playing');setIcons();});
  v.addEventListener('loadedmetadata',()=>{try{const t=Number(localStorage.getItem(key));if(t>5&&Number.isFinite(v.duration)&&t<v.duration-10){v.currentTime=t;toast('Resumed at '+fmt(t));}}catch{} paint();});
  setInterval(()=>{if(source&&!v.paused&&v.currentTime>5){try{localStorage.setItem(key,String(Math.floor(v.currentTime)));}catch{}}},3000);

  function paint(){const d=v.duration||0,t=v.currentTime||0,p=d?Math.max(0,Math.min(100,t/d*100)):0;$('fill').style.width=p+'%';$('knob').style.left=p+'%';$('time').textContent=fmt(t)+' / '+fmt(d);let e=0;try{for(let i=0;i<v.buffered.length;i++)if(v.buffered.start(i)<=t)e=Math.max(e,v.buffered.end(i));}catch{}$('buf').style.width=d?Math.min(100,e/d*100)+'%':'0%';}
  ['timeupdate','progress','durationchange','loadedmetadata'].forEach(e=>v.addEventListener(e,paint));
  const bar=$('bar');
  const pos=e=>{const r=bar.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));};
  function scrub(e){if(Number.isFinite(v.duration))v.currentTime=pos(e)*v.duration;}
  bar.addEventListener('pointerdown',e=>{dragging=true;bar.classList.add('drag');bar.setPointerCapture(e.pointerId);scrub(e);});
  bar.addEventListener('pointermove',e=>{const p=pos(e);$('tip').style.left=p*100+'%';$('tip').textContent=fmt(p*(v.duration||0));if(dragging)scrub(e);});
  ['pointerup','pointercancel'].forEach(e=>bar.addEventListener(e,()=>{dragging=false;bar.classList.remove('drag');}));

  P.addEventListener('click',e=>{if(e.target.closest('.controls'))return;const now=Date.now(),r=P.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(now-lastTap<280){clearTimeout(tapTimer);lastTap=0;if(x<.33){seekBy(-10);flash('rl');}else if(x>.67){seekBy(10);flash('rr');}else $('fs').click();}else{lastTap=now;tapTimer=setTimeout(()=>{if(P.classList.contains('idle')&&!v.paused){wake();return;}toggle();},280);}});
  ['pointermove','pointerdown','keydown'].forEach(e=>P.addEventListener(e,wake));
  document.addEventListener('keydown',e=>{if(!$('view').classList.contains('hidden')&&e.target.tagName!=='INPUT'&&e.target.tagName!=='BUTTON'){switch(e.key.toLowerCase()){case ' ':case 'k':e.preventDefault();toggle();break;case 'arrowleft':e.preventDefault();seekBy(-5);break;case 'arrowright':e.preventDefault();seekBy(5);break;case 'j':seekBy(-10);break;case 'l':seekBy(10);break;case 'arrowup':e.preventDefault();v.volume=Math.min(1,v.volume+.1);break;case 'arrowdown':e.preventDefault();v.volume=Math.max(0,v.volume-.1);break;case 'm':v.muted=!v.muted;break;case 'f':$('fs').click();break;default:return;}wake();}});
  if(!document.pictureInPictureEnabled)$('pip').classList.add('hidden');
  setIcons();
  const src=new URLSearchParams(location.search).get('url'); if(src)start(src); else $('open').classList.remove('hidden');
})();
</script>
</body>
</html>
